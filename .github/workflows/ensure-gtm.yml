name: Ensure GTM on all HTML pages

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ensure-gtm.yml"

permissions:
  contents: write

jobs:
  ensure-gtm:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Audit and add GTM where missing
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          GTM_ID = "GTM-MQRB2X8K"

          head_script = """<!-- Google Tag Manager -->
          <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
          new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
          j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
          'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
          })(window,document,'script','dataLayer','GTM-MQRB2X8K');</script>
          <!-- End Google Tag Manager -->"""

          body_noscript = """<!-- Google Tag Manager (noscript) -->
          <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-MQRB2X8K"
          height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
          <!-- End Google Tag Manager (noscript) -->"""

          html_files = sorted(Path('.').rglob('*.html'))
          changed = []
          already_complete = 0
          missing_head = 0
          missing_noscript = 0

          for path in html_files:
              text = path.read_text(encoding='utf-8')
              original = text

              has_head = (
                  GTM_ID in text and
                  "googletagmanager.com/gtm.js" in text
              )
              has_noscript = (
                  GTM_ID in text and
                  "googletagmanager.com/ns.html" in text
              )

              if has_head and has_noscript:
                  already_complete += 1
                  continue

              if not has_head:
                  missing_head += 1
                  if '</head>' in text:
                      text = text.replace('</head>', head_script + '\n</head>', 1)
                  else:
                      text = head_script + '\n' + text

              if not has_noscript:
                  missing_noscript += 1
                  m = re.search(r'<body(?:\s[^>]*)?>', text, flags=re.I)
                  if m:
                      insert_at = m.end()
                      text = text[:insert_at] + '\n' + body_noscript + text[insert_at:]
                  elif '</head>' in text:
                      text = text.replace('</head>', '</head>\n' + body_noscript, 1)
                  else:
                      text = body_noscript + '\n' + text

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          print(f"Total HTML files: {len(html_files)}")
          print(f"Already complete: {already_complete}")
          print(f"Missing GTM head script: {missing_head}")
          print(f"Missing GTM noscript: {missing_noscript}")
          print(f"Files updated: {len(changed)}")
          if changed:
              print("Updated paths:")
              for p in changed:
                  print(p)
          PY

      - name: Commit GTM coverage update
        run: |
          git config user.name "Kydos Digital"
          git config user.email "support@kydosdigital.com"
          git rm .github/workflows/ensure-gtm.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Ensure GTM tracking across all site pages"
          git push origin main
