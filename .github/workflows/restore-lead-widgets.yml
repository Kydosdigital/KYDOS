name: Restore Kydos lead widgets

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/restore-lead-widgets.yml"

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Restore popup form and chat widget
        run: |
          python - <<'PY'
          from pathlib import Path

          popup_marker = 'id="popup-QaXpE6farn2QrRKGKVR1"'
          chat_marker = 'data-widget-id="6864f9f62f71ade91116c11b"'

          popup = """<!-- LEADCONNECTOR POPUP FORM -->
          <iframe
            src="https://api.leadconnectorhq.com/widget/form/QaXpE6farn2QrRKGKVR1"
            style="display:none;width:100%;height:100%;border:none;border-radius:3px"
            id="popup-QaXpE6farn2QrRKGKVR1"
            data-layout='{"id":"POPUP"}'
            data-trigger-type="showAfter"
            data-trigger-value="15"
            data-activation-type="alwaysActivated"
            data-activation-value=""
            data-deactivation-type="neverDeactivate"
            data-deactivation-value=""
            data-form-name="Marketing Form - Claim Offer"
            data-height="643"
            data-layout-iframe-id="popup-QaXpE6farn2QrRKGKVR1"
            data-form-id="QaXpE6farn2QrRKGKVR1"
            title="Marketing Form - Claim Offer">
          </iframe>
          <script src="https://link.msgsndr.com/js/form_embed.js"></script>"""

          chat = """<!-- LEADCONNECTOR CHAT WIDGET -->
          <script>
          window.leadConnectorConfig = { disableGtm: true };
          </script>
          <script
            src="https://widgets.leadconnectorhq.com/loader.js"
            data-resources-url="https://widgets.leadconnectorhq.com/chat-widget/loader.js"
            data-widget-id="6864f9f62f71ade91116c11b">
          </script>"""

          changed = 0
          for path in Path('.').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              additions = []
              if popup_marker not in text:
                  additions.append(popup)
              if chat_marker not in text:
                  additions.append(chat)
              if not additions:
                  continue
              block = '\n' + '\n'.join(additions) + '\n'
              if '</body>' in text:
                  text = text.replace('</body>', block + '</body>', 1)
              else:
                  text += block
              path.write_text(text, encoding='utf-8')
              changed += 1

          print(f'Updated {changed} HTML files')
          PY

      - name: Commit restoration
        run: |
          git config user.name "Kydos Digital"
          git config user.email "support@kydosdigital.com"
          git rm .github/workflows/restore-lead-widgets.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Restore chatbot and popup form across site"
          git push origin main
